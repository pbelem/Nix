# -----------------------------------------------------
# Hyprland configuration for use with Noctalia shell
# Hyprland handles window management (tiling, workspaces)
# Noctalia provides bar, notifications, background, etc.
# Documentation: https://wiki.hyprland.org
# -----------------------------------------------------

# -----------------------------------------------------
# Monitors
# -----------------------------------------------------
monitor=, 1920x1080@320, auto, 1

# -----------------------------------------------------
# Autostart
# -----------------------------------------------------
#exec-once = 

# -----------------------------------------------------
# Environment Variables
# -----------------------------------------------------
env = XCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = LIBVA_DRIVER_NAME,radeonsi
#env = __GLX_VENDOR_LIBRARY_NAME,mesa
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = GDK_SCALE,1
env = MOZ_ENABLE_WAYLAND,1
env = OZONE_PLATFORM,wayland
env = NIXOS_OZONE_WL,1

# -----------------------------------------------------
# Input (ANSI US-International Layout)
# -----------------------------------------------------
input {
    kb_layout = us
    kb_variant = intl
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = false
    }

    sensitivity = 0
}

# -----------------------------------------------------
# General Look & Feel
# -----------------------------------------------------
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(ffb86bff) rgba(ff79c6ff) 45deg
    col.inactive_border = rgba(44475aff)
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 20
    rounding_power = 2
    drop_shadow = true
    shadow_range = 4
    shadow_render_power = 3
    shadow_color = rgba(1a1a1aee)

    blur {
        enabled = true
        size = 3
        passes = 2
        vibrancy = 0.1696
        new_optimizations = on
    }

    # Noctalia layer rule for background blur
    layerrule {
        name = noctalia
        match:namespace = noctalia-background-.*$
        ignore_alpha = 0.5
        blur = true
        blur_popups = true
    }
}

# -----------------------------------------------------
# Animations
# -----------------------------------------------------
animations {
    enabled = true
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.38, 0.04, 1, 0.07

    animation = windows, 1, 3, md3_decel, popin 60%
    animation = border, 1, 10, default
    animation = fade, 1, 3, md3_decel
    animation = workspaces, 1, 7, menu_decel, slide
}

# -----------------------------------------------------
# Layouts & Misc
# -----------------------------------------------------
dwindle {
    pseudotile = true
    preserve_split = true
}

gestures {
    workspace_swipe = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
    vrr = 1
}


# -----------------------------------------------------
# Keybindings (SUPER Key)
# -----------------------------------------------------
$mainMod = SUPER

# Launch apps
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit
bind = $mainMod, E, exec, yazi
bind = $mainMod, T, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod, B, exec, brave
bind = SUPER, ESC, exec, kitty -e btop

# Move focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces (1-10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, right, workspace, +1
bind = $mainMod, left, workspace, -1


# Mouse binds
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Noctalia binds
$ipc = qs -c noctalia-shell ipc call

# Core binds
bind = SUPER, SPACE, exec, $ipc launcher toggle
bind = SUPER, S, exec, $ipc controlCenter toggle
bind = SUPER, comma, exec, $ipc settings toggle

# Media keys
bindel = , XF86AudioRaiseVolume, exec, $ipc volume increase
bindel = , XF86AudioLowerVolume, exec, $ipc volume decrease
bindl = , XF86AudioMute, exec, $ipc volume muteOutput
bindel = , XF86MonBrightnessUp, exec, $ipc brightness increase
bindel = , XF86MonBrightnessDown, exec, $ipc brightness decrease

# My Noctalia binds
bind = $mainMod, V, exec, $ipc launcher clipboard